<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Social</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div>
            <h1>My Social</h1>
            <span>Connect • Chat • Community</span>
        </div>

        <button class="icon-btn">🔍</button>

    </header>


    <!-- PROFILE MINI -->
    <section class="profile-card">

        <div class="avatar">
            👤
        </div>

        <div class="profile-info">
            <h2>Welcome 👋</h2>
            <p>Complete your profile</p>
        </div>

        <button class="arrow-btn">›</button>

    </section>


    <!-- STATUS -->
    <section class="section">

        <div class="section-title">
            <h2>Status</h2>
            <button>See All</button>
        </div>

        <div class="status-list">

            <div class="status add-status">
                <div class="status-avatar">＋</div>
                <span>My Status</span>
            </div>

            <div class="status">
                <div class="status-avatar">👨</div>
                <span>Raka</span>
            </div>

            <div class="status">
                <div class="status-avatar">👩</div>
                <span>Alya</span>
            </div>

            <div class="status">
                <div class="status-avatar">👨</div>
                <span>Dimas</span>
            </div>

        </div>

    </section>


    <!-- MENU -->
    <section class="section">

        <div class="section-title">
            <h2>Explore</h2>
        </div>

        <div class="menu-grid">

            <button class="menu-card">
                <div class="menu-icon chat-icon">💬</div>
                <strong>Chat</strong>
                <small>Private messages</small>
            </button>

            <button class="menu-card">
                <div class="menu-icon group-icon">👥</div>
                <strong>Groups</strong>
                <small>Join communities</small>
            </button>

            <button class="menu-card">
                <div class="menu-icon community-icon">🌐</div>
                <strong>Community</strong>
                <small>Find your community</small>
            </button>

            <button class="menu-card">
                <div class="menu-icon couple-icon">❤️</div>
                <strong>Couple</strong>
                <small>Find your partner</small>
            </button>

        </div>

    </section>


    <!-- PEOPLE -->
    <section class="section">

        <div class="section-title">
            <h2>People</h2>
            <button>See All</button>
        </div>

        <div class="people-card">

            <div class="person-avatar">👩</div>

            <div class="person-info">
                <strong>Alya</strong>
                <span>🟢 Online • Just Friend</span>
            </div>

            <button class="chat-btn">Chat</button>

        </div>


        <div class="people-card">

            <div class="person-avatar">👨</div>

            <div class="person-info">
                <strong>Raka</strong>
                <span>🟢 Online • Just Friend</span>
            </div>

            <button class="chat-btn">Chat</button>

        </div>

    </section>


    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">

        <button class="nav-item active">
            <span>⌂</span>
            <small>Home</small>
        </button>

        <button class="nav-item">
            <span>💬</span>
            <small>Chat</small>
        </button>

        <button class="nav-item">
            <span>🟢</span>
            <small>Status</small>
        </button>

        <button class="nav-item">
            <span>👥</span>
            <small>Community</small>
        </button>

        <button class="nav-item">
            <span>👤</span>
            <small>Profile</small>
        </button>

    </nav>

</div>

<script src="js/app.js"></script>

</body>
    </html>
